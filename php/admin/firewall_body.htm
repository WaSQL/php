<view:default>
<script type="text/javascript">
	function firewallFilters(){
		var f=document.forms.firewall_form;
		return {
			_menu:'firewall',
			fw_search:f.fw_search.value, fw_status:f.fw_status.value,
			fw_sort:f.fw_sort.value, fw_page:f.fw_page.value, setprocessing:0
		};
	}
	function firewallSet(name,val){
		var f=document.forms.firewall_form;
		if(f && f[name]!==undefined){ f[name].value=val; }
	}
	function firewallReloadGrid(){
		return wacss.ajaxGet('/php/admin.php','firewall_content',firewallFilters());
	}
	function firewallSearch(){ firewallSet('fw_page',1); return firewallReloadGrid(); }
	function firewallStatus(sel){ firewallSet('fw_status',sel.value); firewallSet('fw_page',1); return firewallReloadGrid(); }
	function firewallSort(key){ firewallSet('fw_sort',key); firewallSet('fw_page',1); return firewallReloadGrid(); }
	function firewallCheckAll(cb){
		var list=document.querySelectorAll('.fw-check');
		for(var i=0;i<list.length;i++){ list[i].checked=cb.checked; }
	}
	function firewallCheckedIds(){
		var ids=[], list=document.querySelectorAll('.fw-check:checked');
		for(var i=0;i<list.length;i++){ ids.push(list[i].value); }
		return ids;
	}
	function firewallRow(action,id){
		if(action==='delete' && !confirm('Delete this record? (its history stays)')){ return false; }
		var p=firewallFilters(); p.func=action; p.id=id;
		wacss.ajaxGet('/php/admin.php','firewall_content',p);
		return false;
	}
	function firewallBulk(action){
		var ids=firewallCheckedIds();
		if(!ids.length){ alert('Tick some rows first.'); return false; }
		if(action==='delete' && !confirm('Delete '+ids.length+' record(s)?')){ return false; }
		var p=firewallFilters(); p.func=action; p.ids=ids.join(',');
		wacss.ajaxGet('/php/admin.php','firewall_content',p);
		return false;
	}
	function firewallEditNote(id,el){
		var cur=el.innerText.trim(); if(cur==='+ note'){ cur=''; }
		var v=prompt('Note for this address:',cur);
		if(v===null){ return; }
		var p=firewallFilters(); p.func='note'; p.id=id; p.notes=v;
		wacss.ajaxGet('/php/admin.php','firewall_content',p);
	}
	function firewallAddIp(){
		var ip=prompt('IP address to block:'); if(!ip){ return false; }
		var reason=prompt('Reason (optional):')||'';
		var p=firewallFilters(); p.func='add'; p.ip=ip.trim(); p.reason=reason;
		wacss.ajaxGet('/php/admin.php','firewall_content',p);
		return false;
	}
	function firewallPruneHistory(){
		var d=prompt('Delete history events older than how many days?','180');
		d=parseInt(d,10); if(!(d>0)){ return false; }
		if(!confirm('Delete history older than '+d+' days?')){ return false; }
		window.location='/php/admin.php?_menu=firewall&func=prune_history&days='+d;
		return false;
	}
	function firewallShowTab(which){
		var tabs=document.querySelectorAll('#firewall_tabs li');
		for(var i=0;i<tabs.length;i++){ tabs[i].className=''; }
		document.getElementById('firewall_tab_'+which).className='active';
		if(which==='blocked'){ firewallReloadGrid(); }
		else{ wacss.ajaxGet('/php/admin.php','firewall_content',{_menu:'firewall',func:'history',setprocessing:0}); }
		return false;
	}
</script>

<div class="wadmin-head"><span class="icon-lock"></span> Blocked IPs Firewall</div>
