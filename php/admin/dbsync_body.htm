<view:default>
<?=buildOnLoad("wacss.loadScript('/php/admin/dbsync_js.js');");?>
<style>
.dbsync-head{display:flex;align-items:center;gap:10px;margin:22px 0 16px;font-size:1.5rem;font-weight:700;color:#363636;}
.dbsync-head .icon-database{opacity:.6;}
.dbsync-card{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.06);padding:18px 20px;}
.dbsync-bar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;}
.dbsync-field{display:flex;flex-direction:column;gap:5px;}
.dbsync-field.grow{flex:1;min-width:220px;}
.dbsync-field > label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:#7a7a7a;}
.dbsync-field select{width:100%;}
.dbsync-arrow{align-self:flex-end;margin-bottom:8px;color:#b5b5b5;font-size:1.4rem;line-height:1;}
.dbsync-diffs{display:flex;align-items:center;gap:7px;font-size:.9rem;color:#4a4a4a;margin-bottom:8px;cursor:pointer;white-space:nowrap;}
.dbsync-diffs input{width:16px;height:16px;cursor:pointer;}
.dbsync-content{margin-top:18px;}
.dbsync-summary{margin:2px 0 14px;font-size:.85rem;font-weight:600;color:#5a5a5a;}
</style>
<div class="dbsync-head"><span class="icon-database"></span> DB Sync Tool</div>
<form method="post" name="dbsync_form" action="/php/admin.php" data-setprocessing="dbsync_content" onsubmit="this.dataset.setprocessing='dbsync_content';this.tab.value='compare';return wacss.ajaxPost(this,'dbsync_content');">
	<input type="hidden" name="_menu" value="dbsync" />
	<input type="hidden" name="func" value="compare" />
	<input type="hidden" name="tab" value="compare" />
	<div class="dbsync-card">
		<div class="dbsync-bar">
			<div class="dbsync-field grow"><label>Source</label><?=dbsyncFormField('source');?></div>
			<span class="dbsync-arrow">&rarr;</span>
			<div class="dbsync-field grow"><label>Target</label><?=dbsyncFormField('target');?></div>
			<label class="dbsync-diffs"><input type="checkbox" name="diffs" value="1" data-type="checkbox" /> Diffs only</label>
			<div class="dbsync-field"><button type="submit" class="wacss_button is-mobile-responsive <?=configValue('admin_color');?>"><span class="icon-sync-diff"></span> Compare</button></div>
		</div>
	</div>
</form>
<div class="dbsync-content"><div id="dbsync_content"></div></div>
</view:default>

<view:compare>
<ul class="nav-tabs">
	<li class="active"><a href="#" data-tab="compare_tables_indexes" onclick="return dbsyncCompare(this);">Tables and Indexes</a></li>
	<li><a href="#" data-tab="compare_functions_procedures" onclick="return dbsyncCompare(this);">Functions and Procedures</a></li>
</ul>
<div id="compare_results">

</view:compare_tables_indexes>

<div class="w_centerpop_content" style="max-height:85vh;overflow:auto;">
	<?=$diff;?>

		<button type="button" id="sync_fields_button" class="wacss_button is-mobile-responsive" onclick="dbsyncFunc(this);"  data-div="centerpop" data-status="different" data-func="sync_fields" data-table="<?=encodeHtml($table);?>" data-confirm="Confirm sync fields?" data-source="<?=encodeHtml($source);?>" data-setprocessing="sync_fields_button" data-target="<?=encodeHtml($target);?>"><span class="icon-sync"></span> Syncronize</button>

	</div>
	</view:sync_fields_button>
	<view:sync_indexes_button>
	<div class="align-right w_top">
		<button type="button" id="sync_indexes_button" class="wacss_button is-mobile-responsive" onclick="dbsyncFunc(this);"  data-div="centerpop" data-status="different" data-func="sync_indexes" data-table="<?=encodeHtml($table);?>" data-confirm="Confirm sync indexes?" data-setprocessing="sync_indexes_button" data-source="<?=encodeHtml($source);?>" data-target="<?=encodeHtml($target);?>"><span class="icon-sync"></span> Syncronize</button>

	</div>
	</view:sync_procedure_button>
	<?=buildOnLoad("centerObject('centerpop');");?>
</div>
</view:view_diff>

<view:view_sync>

	<?=$sync;?>
</div>
