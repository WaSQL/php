<view:default>
<style>
.import-wrap{max-width:1100px;}
.import-head{display:flex;align-items:center;gap:10px;margin:22px 0 16px;font-size:1.5rem;font-weight:700;color:#363636;}
.import-head .icon-import{opacity:.6;}

.import-card-title{display:flex;align-items:center;gap:9px;font-size:1.1rem;font-weight:700;color:#363636;margin:0 0 16px;padding-bottom:12px;border-bottom:1px solid rgba(0,0,0,.06);}

.import-field{margin-bottom:14px;}

.import-field .req{color:#e0245e;font-weight:700;}
.import-row{display:flex;gap:12px;}
.import-row .import-field{flex:1;}
.import-row .import-field.narrow{flex:0 0 34%;}
.import-checks{margin-bottom:12px;}
.import-actions{margin-top:auto;padding-top:16px;border-top:1px solid rgba(0,0,0,.06);}
.import-results{margin-bottom:18px;border:1px solid #cdd9ee;border-radius:12px;background:#f6faff;padding:14px 16px;}

<form method="post" name="importform" enctype="multipart/form-data" action="/php/admin.php" onsubmit="return submitForm(this);">

<input type="hidden" name="func" value="process" />
<input type="hidden" name="filetype" value="xml" />
<div class="import-wrap">
	<div class="import-head"><span class="icon-import"></span> Import</div>
	<view:processed>
	<div class="import-results">
		<div class="import-results-title"><span class="icon-mark"></span> Import Results</div>

	<div class="import-card import-file-card">

			<div class="import-card-title"><span class="icon-file-txt"></span> CSV Import Options</div>

	</div>
