<view:default>
<style type="text/css">
	xmp{margin:2px 5px;}
	div.row{margin-bottom:5px;}
	.well{overflow:auto;}
	.manual-layout{display:flex;gap:16px;align-items:stretch;height:82vh;}
	.manual-side{flex:0 0 270px;display:flex;}
	.manual-side .wadmin-card{display:flex;flex-direction:column;flex:1;overflow:auto;margin-bottom:0;}
	.manual-results{flex:1;overflow:auto;margin-bottom:0;}
	.manual-search{display:flex;gap:8px;margin-bottom:14px;}
	.manual-search input{flex:1;}
	#ul_files{list-style:none;margin:4px 0 0;padding:0;}
	#ul_files li{margin:2px 0;}
	@media (max-width:820px){.manual-layout{flex-direction:column;height:auto;}.manual-side{flex:1 1 auto;}}
</style>
<div class="wadmin-head"><span class="icon-wasql-doc"></span> WaSQL Documentation</div>
<div class="manual-layout">
	<div class="manual-side">
		<div class="wadmin-card">
			<form method="post" name="manualsearchform" action="/php/admin.php" onsubmit="return wacss.ajaxPost(this,'results');">
				<input type="hidden" name="_menu" value="manual" />
				<input type="hidden" name="func" value="search" />
				<div class="manual-search">
					<input type="text" autofocus="true" class="wacss_input is-mobile-responsive" name="search" placeholder="Search the docs&hellip;" required="required" />
					<button type="submit" class="wacss_button is-mobile-responsive <?=configValue('admin_color');?>"><span class="icon-search"></span> Search</button>
				</div>
			</form>
			<div class="wadmin-label">Code Files</div>
			<ul class="nav-list buttons <?=configValue('admin_color');?>" id="ul_files">
				<?=renderEach('category',$categories,'rec');?>
			</ul>
		</div>
	</div>
	<div class="wadmin-card manual-results" id="results">
		<?=buildOnLoad("wacss.loadScript('/php/admin/manual_js.js');wacss.init();");?>
	</div>
</div>
</view:default>

<view:category>
	<li><a href="#" onclick="return manualNav(this);" data-div="filenames_<?=encodeHtml($rec['category']);?>" data-func="filenames" data-category="<?=encodeHtml($rec['category']);?>"><icon class="<?=encodeHtml($rec['icon']);?>"></icon> <?=encodeHtml($rec['category']);?> (<?=encodeHtml($rec['cnt']);?>)</a>
		<div id="filenames_<?=encodeHtml($rec['category']);?>" style="margin-left:20px;padding-left:5px;border-left:1px solid #ccc;"></div>

	</li>
</view:category>

<view:filenames>
	<view:filename>
		<div>
			<a href="#" onclick="return manualNav(this);" data-div="names_<?=encodeHtml(sha1($rec['afile']));?>" data-func="names" data-afile="<?=encodeHtml($rec['afile']);?>" class="wacss_button is-mobile-responsive" style="margin-bottom:3px;"><?=encodeHtml(base64_decode($rec['afile']));?> (<?=encodeHtml($rec['cnt']);?>)</a>
			<div id="names_<?=encodeHtml(sha1($rec['afile']));?>" style="margin-left:20px;"></div>
		</div>
	</view:filename>
	<?=renderEach('filename',$filenames,'rec');?>
</view:filenames>

<view:names>
	<view:name>
		<div><a href="#" data-docid="<?=encodeHtml($rec['_id']);?>" onclick="return manualNav(this);" data-div="results" data-func="docid" class="<?=encodeHtml($rec['class']);?> w_link w_block" style="margin-bottom:3px;"><?=encodeHtml($rec['name']);?> (Line <?=encodeHtml($rec['afile_line']);?>)</a></div>
	</view:name>
	<?=renderEach('name',$names,'rec');?>
</view:names>

<view:search_results>
	<view:rec>
	<div style="display:flex;justify-content:space-between;flex-wrap: wrap;align-content: flex-start;">
		<div class="w_bold w_bigger"><span class="w_biggest brand-<?=encodeHtml(strtolower($rec['category']));?>"></span> <?=encodeHtml($rec['name']);?></div>
		<div class="w_gray w_smaller">found on line <?=encodeHtml($rec['afile_line']);?> in <?=encodeHtml(base64_decode($rec['afile']));?></div>
	</div>
	<div style="margin-left:30px;">
		<div class="w_gray" style="margin:0 0 10px 20px;"><?=$rec['describe'];?></div>
		<div class="w_bold w_big">Usage</div>
		<div class="well">
			<view:usage>
			<div><?=base64_decode($usage);?></div>
			</view:usage>
			<?=renderEach('usage',$rec['info_ex']['usage'],'usage');?>
		</div>
		<div class="w_bold w_big">Return</div>
		<div class="well">
		<view:return>
			<div><?=base64_decode($return);?></div>
		</view:return>
		<?=renderEach('return',$rec['info_ex']['return'],'return');?>
		</div>
		<div class="w_bold w_bigger">Comments</div>
		<div class="well"><?=nl2br(base64_decode($rec['comments']));?></div>
	</div>
	</view:rec>
	<?=renderEach('rec',$recs,'rec');?>
</view:search_results>

<view:no_results>
	<div class="w_red w_big">No Search Results</div>
</view:no_results>
